[package]
name = "complex-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async calculation server with Redis-backed queue and SQLite ledger"
authors = ["Aryan Godara"]

[[bin]]
name = "complex-server"
path = "src/main.rs"

[lib]
name = "complex_server"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "timeout"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

redis = { version = "0.27", features = ["tokio-comp"] }
deadpool-redis = "0.18"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

dashmap = "6"

num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
